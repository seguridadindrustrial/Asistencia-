<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Registro de Asistencia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #f0f4f8; min-height: 100vh; padding: 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 20px; width: 100%; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; color: #1f3a5f; margin-bottom: 16px; text-align: center; }
  h2 { font-size: 16px; color: #1f3a5f; margin: 16px 0 10px; }
  input, select { padding: 13px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; width: 100%; }
  input:focus, select:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
  button { border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
  .btn-entrar { background: #2563eb; color: #fff; padding: 13px 18px; }
  .btn-entrar:active { background: #1d4ed8; }
  .btn-registrar { background: #16a34a; color: #fff; width: 100%; padding: 15px; font-size: 18px; font-weight: 600; margin-top: 6px; }
  .btn-registrar:active { background: #15803d; }
  .btn-secondary { background: #e2e8f0; color: #334155; padding: 12px 16px; }
  .btn-secondary:active { background: #cbd5e1; }
  .btn-danger { background: #dc2626; color: #fff; padding: 12px 16px; }
  .btn-danger:active { background: #b91c1c; }
  .mensaje { padding: 10px 12px; border-radius: 10px; font-size: 15px; margin-top: 10px; display: none; }
  .ok { background: #dcfce7; color: #166534; display: block; }
  .error { background: #fee2e2; color: #991b1b; display: block; }
  .info { background: #eff6ff; color: #1e40af; display: block; }
  .welcome { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 16px; line-height: 1.5; }
  .admin-link { margin-top: 18px; text-align: center; }
  .admin-link a { color: #64748b; font-size: 14px; cursor: pointer; text-decoration: underline; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn-row .btn-secondary { flex: 1; min-width: 120px; }
  .hidden { display: none !important; }
  .semana-row { margin-bottom: 14px; }
  .semana-row label { font-size: 14px; color: #475569; font-weight: 600; display: block; margin-bottom: 5px; }
  .dia-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #f8fafc; }
  .dia-nombre { font-weight: 700; font-size: 16px; margin-bottom: 9px; color: #1f3a5f; }
  .dia-botones { display: flex; gap: 8px; margin-bottom: 9px; }
  .dia-botones button { flex: 1; padding: 13px; border-radius: 10px; font-size: 16px; font-weight: 600; border: 2px solid #cbd5e1; background: #fff; color: #475569; }
  .dia-botones button.activo-si { background: #16a34a; color: #fff; border-color: #16a34a; }
  .dia-botones button.activo-no { background: #64748b; color: #fff; border-color: #64748b; }
  .inp-desc, .sel-he, .inp-he-horas, .sel-tipo, .inp-horas { margin-bottom: 9px; }
  .inp-desc::placeholder { color: #94a3b8; }
  .trabajo { display: flex; flex-direction: column; gap: 9px; margin-bottom: 10px; padding: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; }
  .btn-quitar { align-self: flex-end; background: #fee2e2; color: #991b1b; padding: 8px 14px; font-size: 14px; border-radius: 8px; }
  .btn-quitar:active { background: #fecaca; }
  .btn-agregar { width: 100%; background: #eff6ff; color: #1e40af; border: 1px dashed #93c5fd; padding: 12px; font-size: 15px; margin-top: 2px; }
  .btn-agregar:active { background: #dbeafe; }
  .btn-quitar-dia { width: 100%; background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 10px; font-size: 14px; margin-top: 2px; }
  .btn-quitar-dia:active { background: #e2e8f0; }
  .dia-card.oculto { display: none; }
  .btn-restaurar { background: #dbeafe; color: #1e40af; padding: 9px 14px; font-size: 14px; border-radius: 8px; margin: 0 6px 8px 0; }
  .btn-restaurar:active { background: #bfdbfe; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
  th, td { border: 1px solid #e2e8f0; padding: 7px 9px; text-align: left; }
  th { background: #1f3a5f; color: #fff; }
  tr:nth-child(even) { background: #f8fafc; }
  .scroll { max-height: 360px; overflow-y: auto; }
</style>
</head>
<body>
<div class="card">
  <h1>Registro de Asistencia</h1>

  <div id="vistaLogin">
    <div style="display:flex; gap:8px;">
      <input id="cedula" type="tel" placeholder="Ingrese su cédula" autocomplete="off" style="flex:1;">
      <button id="btnEntrar" class="btn-entrar" style="white-space:nowrap;">Entrar</button>
    </div>
    <div id="mensajeLogin" class="mensaje"></div>
    <div class="admin-link"><a id="btnAdmin">Acceso administrador</a></div>
    <div id="adminBox" class="hidden" style="margin-top:10px;">
      <div style="display:flex; gap:8px;">
        <input id="adminPass" type="password" placeholder="Contraseña" autocomplete="off" style="flex:1;">
        <button id="btnAdminEntrar" class="btn-entrar" style="white-space:nowrap;">Ingresar</button>
      </div>
      <div id="mensajeAdminLogin" class="mensaje"></div>
    </div>
  </div>

  <div id="vistaPanel" class="hidden">
    <div class="welcome">Bienvenido: <strong id="lblNombre"></strong><br>Cédula: <span id="lblCedula"></span></div>

    <div class="semana-row">
      <label for="semana">Semana del</label>
      <input id="semana" type="date">
    </div>

    <h2>Marque cada día de la semana</h2>
    <div id="notaDias" class="mensaje"></div>
    <div id="listaDias"></div>
    <div id="barraQuitados"></div>

    <button id="btnRegistrar" class="btn-registrar">Registrar asistencia</button>
    <div id="mensajePanel" class="mensaje"></div>
    <div class="btn-row">
      <button id="btnSalir" class="btn-secondary">Cerrar sesión</button>
    </div>
  </div>

  <div id="vistaAdmin" class="hidden">
    <h2>Panel de administrador</h2>
    <div style="margin-bottom:10px;">
      <label for="selSemanaAdmin" style="font-size:14px;color:#475569;font-weight:600;">Semana:</label>
      <select id="selSemanaAdmin" style="padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin-left:8px;"></select>
    </div>
    <div style="overflow-x:auto;">
      <div class="scroll">
        <table>
          <thead><tr><th>Semana</th><th>Fecha</th><th>Día</th><th>Tipo</th><th>Horas</th><th>Descripción</th><th>Monto</th><th>Categoría</th><th>Cédula</th><th>Nombre</th></tr></thead>
          <tbody id="cuerpoAdmin"></tbody>
        </table>
      </div>
    </div>
    <div class="btn-row">
      <button id="btnNomina1" class="btn-secondary">Descargar Nómina 1</button>
      <button id="btnNomina2" class="btn-secondary">Descargar Nómina 2</button>
      <button id="btnLimpiar" class="btn-danger">Limpiar</button>
      <button id="btnSalirAdmin" class="btn-secondary">Salir</button>
    </div>
    <div id="mensajeAdmin" class="mensaje"></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "admin123";

const TIPOS_POR_HORA = ["Horas Extras"];

const TIPOS_TECNICO_FIJO = {
  "entre semana": ["Guardia Nocturna", "Trabajo Nocturno", "Trabajo de Madrugada", "Horas Extras"],
  "domingo": ["Domingo Trabajado", "Trabajo Especial", "Guardia Nocturna", "Trabajo de Madrugada"]
};

const TIPOS_TECNICO_AVANCE = {
  "entre semana": ["Dia Trabajado", "Guardia Nocturna", "Trabajo Nocturno", "Trabajo de Madrugada", "Horas Extras"],
  "domingo": ["Domingo Trabajado", "Trabajo Especial", "Guardia Nocturna", "Trabajo de Madrugada"]
};

const TIPOS_PORTERO = {
  "entre semana": ["Horas Extras"],
  "domingo": ["Domingo Trabajado", "Trabajo Especial"]
};

const TIPOS_O_L_AVANCE = {
  "entre semana": ["Dia Trabajado", "Trabajo Nocturno Avances"],
  "domingo": ["Domingo Trabajado"]
};

const FERIADOS = ["01/01", "16/02", "17/02", "02/04", "03/04", "19/04", "01/05", "24/06", "05/07", "24/07", "12/10", "24/12", "25/12"];

function esFeriado(fecha) {
  var p = String(fecha).split("/");
  return FERIADOS.indexOf(p[0] + "/" + p[1]) >= 0;
}

const PRECIOS = {
  "O&L Avance": {
    "Dia Trabajado": 12,
    "Trabajo Nocturno Avances": 12,
    "Domingo Trabajado": 18
  },
  "O&L Fijo": {

    "Horas Extras": 2,
    "Domingo Trabajado": 24
  },
  "Tecnicos Avance": {
    "Dia Trabajado": 14,
    "Guardia Nocturna": 12,
    "Trabajo Nocturno": 15,
    "Trabajo de Madrugada": 15,
    "Trabajo Especial": 40,
    "Horas Extras": 2,
    "Feriado": 16,
    "Domingo Trabajado": 24
  },
  "Tecnicos Fijo": {
    "Dia Trabajado": 14,
    "Guardia Nocturna": 12,
    "Trabajo Nocturno": 15,
    "Trabajo de Madrugada": 15,
    "Trabajo Especial": 40,
    "Horas Extras": 2,
    "Feriado": 16,
    "Domingo Trabajado": 24
  },
  "Porteros": {
    "Trabajo Especial": 40,
    "Horas Extras": 2,
    "Feriado": 16,
    "Domingo Trabajado": 24
  }
};

const EMPLEADOS = [
  { cedula: "9863644", nombre: "LEONEL LÓPEZ", categoria: "Tecnicos Fijo" },
  { cedula: "7992727", nombre: "DIONICIO  PEÑALOZA", categoria: "Tecnicos Fijo" },
  { cedula: "14379756", nombre: "ANGEL MARTINEZ", categoria: "Tecnicos Fijo" },
  { cedula: "14970816", nombre: "SANDRY FUENMAYOR", categoria: "Tecnicos Fijo" },
  { cedula: "11", nombre: "ENRIQUE MARIN", categoria: "Tecnicos Avance" },
  { cedula: "6516060", nombre: "RAFAEL LEAL", categoria: "Tecnicos Avance" },
  { cedula: "16670026", nombre: "YASIRIS PABON", categoria: "O&L Avance" },
  { cedula: "13291333", nombre: "MARBELYS ALVARADO", categoria: "O&L Fijo" },
  { cedula: "15948681", nombre: "LILLYS AUDIVET", categoria: "O&L Fijo" },
  { cedula: "10537934", nombre: "LUCRECIA ALVARADO", categoria: "O&L Fijo" },
  { cedula: "24087770", nombre: "MILENIS PEREIRA", categoria: "O&L Fijo" },
  { cedula: "14728429", nombre: "RONALD ALVILLARE", categoria: "Porteros" },
  { cedula: "27535304", nombre: "BENGY CADET", categoria: "Porteros" }
];

const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const STORAGE_KEY = "registros_asistencia";
const FINALIZADOS_KEY = "asistencias_finalizados";

let registros = [];
let empleadoActual = null;
let diasQuitados = [];

function cargarRegistros() {
  try {
    var crudos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    registros = crudos.filter(function (r) { return r && r.tipo && typeof r.monto === "number"; });
  } catch (e) { registros = []; }
}
function guardarRegistros() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
}
function cargarFinalizados() {
  try {
    var f = JSON.parse(localStorage.getItem(FINALIZADOS_KEY)) || [];
    return f.filter(function (x) { return x && x.cedula && x.semana && x.dia; });
  } catch (e) { return []; }
}
function guardarFinalizados(f) {
  localStorage.setItem(FINALIZADOS_KEY, JSON.stringify(f));
}
function mostrarMensaje(el, texto, tipo) {
  el.textContent = texto;
  el.className = "mensaje " + tipo;
  setTimeout(function () { el.className = "mensaje"; }, 5000);
}
function lunesDeSemana(d) {
  var diff = (d.getDay() + 6) % 7;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
}
function formatearFecha(d) {
  var dd = String(d.getDate()).padStart(2, "0");
  var mm = String(d.getMonth() + 1).padStart(2, "0");
  return dd + "/" + mm + "/" + d.getFullYear();
}
function fechaTexto(d) {
  return d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function numSemanaISO(d) {
  var fecha = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dia = fecha.getUTCDay() || 7;
  fecha.setUTCDate(fecha.getUTCDate() + 4 - dia);
  var inicioAnio = new Date(Date.UTC(fecha.getUTCFullYear(), 0, 1));
  return Math.ceil((((fecha - inicioAnio) / 86400000) + 1) / 7);
}
function esPorHora(tipo) {
  return TIPOS_POR_HORA.indexOf(tipo) >= 0;
}
function categoriaDe(emp) {
  return emp.categoria || "O&L Avance";
}
function precioDe(tipo) {
  return PRECIOS[categoriaDe(empleadoActual)][tipo];
}
function modoDeDia(dia) {
  var cat = categoriaDe(empleadoActual);
  if (cat === "Tecnicos Fijo" || cat === "Tecnicos Avance" || cat === "Porteros" || cat === "O&L Avance") return "seleccion";
  if (dia === "Domingo") return "autoDomingo";
  if (cat === "O&L Fijo") return "fijo";
  return "avance";
}
function tiposDeDia(dia) {
  var cat = categoriaDe(empleadoActual);
  var lista;
  if (cat === "Tecnicos Fijo") lista = TIPOS_TECNICO_FIJO;
  else if (cat === "Tecnicos Avance") lista = TIPOS_TECNICO_AVANCE;
  else if (cat === "O&L Avance") lista = TIPOS_O_L_AVANCE;
  else lista = TIPOS_PORTERO;
  return dia === "Domingo" ? lista.domingo : lista["entre semana"];
}

function crearFilaTrabajo(dia) {
  var fila = document.createElement("div");
  fila.className = "trabajo";

  var selTipo = document.createElement("select");
  selTipo.className = "sel-tipo";

  var inpHoras = document.createElement("input");
  inpHoras.type = "number";
  inpHoras.min = "1";
  inpHoras.value = "1";
  inpHoras.className = "inp-horas hidden";
  inpHoras.style.display = "none";
  inpHoras.placeholder = "Horas";

  var inpDesc = document.createElement("input");
  inpDesc.type = "text";
  inpDesc.className = "inp-desc";
  inpDesc.placeholder = "Descripción (opcional)";

  var btnQuitar = document.createElement("button");
  btnQuitar.type = "button";
  btnQuitar.className = "btn-quitar";
  btnQuitar.textContent = "Quitar";

  rellenarTipos(selTipo, dia);

  function actualizarHoras() {
    if (esPorHora(selTipo.value)) {
      inpHoras.classList.remove("hidden");
      inpHoras.style.display = "";
    } else {
      inpHoras.classList.add("hidden");
      inpHoras.style.display = "none";
    }
  }
  selTipo.addEventListener("change", actualizarHoras);
  actualizarHoras();

  fila.appendChild(selTipo);
  fila.appendChild(inpHoras);
  fila.appendChild(inpDesc);
  fila.appendChild(btnQuitar);
  return fila;
}

function rellenarTipos(selTipo, dia) {
  selTipo.innerHTML = "";
  tiposDeDia(dia).forEach(function (t) {
    var o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    selTipo.appendChild(o);
  });
}

function crearTarjetaDia(dia) {
  var modo = modoDeDia(dia);
  var card = document.createElement("div");
  card.className = "dia-card";
  card.setAttribute("data-dia", dia);
  card.noExplicito = false;

  var nombre = document.createElement("div");
  nombre.className = "dia-nombre";
  nombre.textContent = dia;

  var botones = document.createElement("div");
  botones.className = "dia-botones";
  var btnSi = document.createElement("button");
  btnSi.type = "button";
  btnSi.textContent = "Sí";
  var btnNo = document.createElement("button");
  btnNo.type = "button";
  btnNo.textContent = "No";
  botones.appendChild(btnSi);
  botones.appendChild(btnNo);

  var cont = document.createElement("div");
  cont.className = "cont-dia hidden";
  cont.style.display = "none";

  if (modo === "seleccion") {
    var lista = document.createElement("div");
    lista.className = "lista-trabajos";
    var btnAgregar = document.createElement("button");
    btnAgregar.type = "button";
    btnAgregar.className = "btn-agregar";
    btnAgregar.textContent = "+ Agregar otro trabajo este día";

    function actualizarQuitar() {
      var filas = lista.querySelectorAll(".trabajo");
      filas.forEach(function (f) {
        var q = f.querySelector(".btn-quitar");
        q.style.display = filas.length > 1 ? "" : "none";
      });
    }
    function agregarFila() {
      var f = crearFilaTrabajo(dia);
      var q = f.querySelector(".btn-quitar");
      q.addEventListener("click", function () { f.remove(); actualizarQuitar(); });
      lista.appendChild(f);
      actualizarQuitar();
    }
    btnAgregar.addEventListener("click", agregarFila);
    cont.appendChild(lista);
    cont.appendChild(btnAgregar);

    btnSi.addEventListener("click", function () {
      if (!lista.querySelector(".trabajo")) agregarFila();
    });
  } else if (modo === "fijo") {
    var inpHoras = document.createElement("input");
    inpHoras.type = "number";
    inpHoras.min = "1";
    inpHoras.value = "1";
    inpHoras.className = "inp-he-horas";
    inpHoras.placeholder = "Cantidad de horas";

    var inpDesc = document.createElement("input");
    inpDesc.type = "text";
    inpDesc.className = "inp-desc";
    inpDesc.placeholder = "Descripción (opcional)";

    cont.appendChild(inpHoras);
    cont.appendChild(inpDesc);
  } else {
    var inpDesc = document.createElement("input");
    inpDesc.type = "text";
    inpDesc.className = "inp-desc";
    inpDesc.placeholder = "Descripción (opcional)";
    cont.appendChild(inpDesc);
  }

  btnSi.addEventListener("click", function () {
    btnSi.classList.add("activo-si");
    btnNo.classList.remove("activo-no");
    card.noExplicito = false;
    cont.classList.remove("hidden");
    cont.style.display = "";
    var heHoras = cont.querySelector(".inp-he-horas");
    if (heHoras) {
      heHoras.classList.remove("hidden");
      heHoras.style.display = "";
    }
  });
  btnNo.addEventListener("click", function () {
    btnNo.classList.add("activo-no");
    btnSi.classList.remove("activo-si");
    card.noExplicito = true;
    cont.classList.add("hidden");
    cont.style.display = "none";
    var lista = cont.querySelector(".lista-trabajos");
    if (lista) lista.innerHTML = "";
    var descs = cont.querySelectorAll(".inp-desc");
    descs.forEach(function (d) { d.value = ""; });
    var heHoras = cont.querySelector(".inp-he-horas");
    if (heHoras) {
      heHoras.classList.add("hidden");
      heHoras.style.display = "none";
    }
  });

  var btnQuitarDia = document.createElement("button");
  btnQuitarDia.type = "button";
  btnQuitarDia.className = "btn-quitar-dia";
  btnQuitarDia.textContent = "Quitar día de la lista";
  btnQuitarDia.addEventListener("click", function () {
    if (diasQuitados.indexOf(dia) < 0) diasQuitados.push(dia);
    card.classList.add("oculto");
    renderBarraQuitados();
    actualizarNota();
  });

  card.appendChild(nombre);
  card.appendChild(botones);
  card.appendChild(cont);
  card.appendChild(btnQuitarDia);
  return card;
}

function resetTarjeta(card) {
  card.noExplicito = false;
  var btnSi = card.querySelector(".dia-botones button:first-child");
  var btnNo = card.querySelector(".dia-botones button:nth-child(2)");
  btnSi.classList.remove("activo-si");
  btnNo.classList.remove("activo-no");
  var cont = card.querySelector(".cont-dia");
  cont.classList.add("hidden");
  cont.style.display = "none";
  var lista = cont.querySelector(".lista-trabajos");
  if (lista) lista.innerHTML = "";
  card.querySelectorAll(".inp-desc").forEach(function (d) { d.value = ""; });
}

function renderBarraQuitados() {
  var barra = document.getElementById("barraQuitados");
  barra.innerHTML = "";
  diasQuitados.forEach(function (dia) {
    var boton = document.createElement("button");
    boton.type = "button";
    boton.className = "btn-restaurar";
    boton.textContent = "Restaurar " + dia;
    boton.addEventListener("click", function () {
      diasQuitados = diasQuitados.filter(function (d) { return d !== dia; });
      var card = document.querySelector('#listaDias .dia-card[data-dia="' + dia + '"]');
      if (card) {
        resetTarjeta(card);
        card.classList.remove("oculto");
      }
      renderBarraQuitados();
      actualizarNota();
    });
    barra.appendChild(boton);
  });
}

function diasRegistrados() {
  var semanaVal = document.getElementById("semana").value;
  var lunes = new Date(semanaVal + "T00:00:00");
  var semStr = formatearFecha(lunes);
  var marcados = {};
  registros.forEach(function (r) {
    if (r.cedula === empleadoActual.cedula && r.semana === semStr && r.tipo !== "libre") marcados[r.dia] = true;
  });
  cargarFinalizados().forEach(function (f) {
    if (f.cedula === empleadoActual.cedula && f.semana === semStr) marcados[f.dia] = true;
  });
  return marcados;
}

function actualizarNota() {
  var lista = document.getElementById("listaDias");
  var restantes = lista.querySelectorAll(".dia-card").length;
  var nota = document.getElementById("notaDias");
  if (restantes === 0) {
    nota.textContent = "No quedan días pendientes en la lista.";
    nota.className = "mensaje ok";
  } else {
    nota.textContent = "Te faltan " + restantes + " día(s) de esta semana por marcar.";
    nota.className = "mensaje info";
  }
}

function construirDiasSemana() {
  var lista = document.getElementById("listaDias");
  lista.innerHTML = "";
  var marcados = diasRegistrados();
  DIAS.forEach(function (dia) {
    if (marcados[dia]) return;
    lista.appendChild(crearTarjetaDia(dia));
  });
  actualizarNota();
  renderBarraQuitados();
}

function entrar() {
  var cedula = document.getElementById("cedula").value.trim();
  var msg = document.getElementById("mensajeLogin");
  var emp = EMPLEADOS.find(function (e) { return e.cedula === cedula; });
  if (!emp) {
    mostrarMensaje(msg, "Cédula no registrada. Verifique e intente de nuevo.", "error");
    return;
  }
  empleadoActual = emp;
  document.getElementById("lblNombre").textContent = emp.nombre;
  document.getElementById("lblCedula").textContent = emp.cedula;

  document.getElementById("semana").value = lunesDeSemana(new Date()).toISOString().slice(0, 10);
  diasQuitados = [];
  construirDiasSemana();
  document.getElementById("vistaLogin").classList.add("hidden");
  document.getElementById("vistaPanel").classList.remove("hidden");
  document.getElementById("cedula").value = "";
  document.getElementById("mensajePanel").className = "mensaje";
}

function salir() {
  empleadoActual = null;
  diasQuitados = [];
  document.getElementById("vistaPanel").classList.add("hidden");
  document.getElementById("vistaLogin").classList.remove("hidden");
  document.getElementById("cedula").focus();
}

function registrar() {
  var semanaVal = document.getElementById("semana").value;
  var lunes = new Date(semanaVal + "T00:00:00");
  var semStr = formatearFecha(lunes);
  var semFin = formatearFecha(new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + 6));
  var numSem = numSemanaISO(lunes);
  var cedula = empleadoActual.cedula;
  var cat = categoriaDe(empleadoActual);
  var esAvance = cat.indexOf("Avance") >= 0;
  var cards = document.querySelectorAll("#listaDias .dia-card:not(.oculto)");
  var nuevos = [];
  var fin = cargarFinalizados();
  var finKeys = {};
  var marcadosFinalizados = 0;

  function marcarFinalizado(dia) {
    var key = cedula + "|" + semStr + "|" + dia;
    if (!finKeys[key]) {
      finKeys[key] = true;
      fin.push({ cedula: cedula, semana: semStr, dia: dia });
      marcadosFinalizados++;
    }
  }
  function reemplazarDia(dia) {
    registros = registros.filter(function (r) {
      return !(r.cedula === cedula && r.semana === semStr && r.dia === dia);
    });
  }
  function baseDe(dia) {
    var i = DIAS.indexOf(dia);
    var fecha = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + i);
    return {
      semana: semStr,
      semanaFin: semFin,
      numSemana: numSem,
      fecha: formatearFecha(fecha),
      fechaTexto: fechaTexto(fecha),
      dia: dia,
      cedula: cedula,
      nombre: empleadoActual.nombre,
      categoria: cat
    };
  }

  cards.forEach(function (card) {
    var dia = card.getAttribute("data-dia");
    var btnSi = card.querySelector(".dia-botones button:first-child");
    var base = baseDe(dia);
    var modo = modoDeDia(dia);

    if (btnSi.classList.contains("activo-si")) {
      reemplazarDia(dia);
      if (modo === "seleccion") {
        var filas = card.querySelectorAll(".lista-trabajos .trabajo");
        filas.forEach(function (fila) {
          var selTipo = fila.querySelector(".sel-tipo");
          var inpHoras = fila.querySelector(".inp-horas");
          var inpDesc = fila.querySelector(".inp-desc");
          var tipo = selTipo.value;
          if (tipo === "Dia Trabajado" && esFeriado(base.fecha)) tipo = "Feriado";
          var horas = esPorHora(tipo) ? parseInt(inpHoras.value, 10) || 1 : 0;
          var monto = esPorHora(tipo) ? precioDe(tipo) * horas : precioDe(tipo);
          nuevos.push(Object.assign({}, base, {
            tipo: tipo,
            horas: horas,
            descripcion: inpDesc.value.trim(),
            monto: monto
          }));
        });
        marcarFinalizado(dia);
      } else if (modo === "fijo") {
        var inpHoras = card.querySelector(".inp-he-horas");
        var inpDesc = card.querySelector(".inp-desc");
        var horas = parseInt(inpHoras.value, 10) || 1;
        nuevos.push(Object.assign({}, base, {
          tipo: "Horas Extras",
          horas: horas,
          descripcion: inpDesc ? inpDesc.value.trim() : "",
          monto: precioDe("Horas Extras") * horas
        }));
        marcarFinalizado(dia);
      } else {
        var inpDesc = card.querySelector(".inp-desc");
        var tipo = modo === "autoDomingo" ? "Domingo Trabajado" : "Dia Trabajado";
        nuevos.push(Object.assign({}, base, {
          tipo: tipo,
          horas: 0,
          descripcion: inpDesc.value.trim(),
          monto: precioDe(tipo)
        }));
        marcarFinalizado(dia);
      }
    } else if (card.noExplicito) {
      if (esAvance) {
        reemplazarDia(dia);
        nuevos.push(Object.assign({}, base, {
          tipo: "libre",
          horas: 0,
          descripcion: "",
          monto: 0
        }));
      } else {
        marcarFinalizado(dia);
      }
    }
  });

  diasQuitados.forEach(function (dia) {
    reemplazarDia(dia);
    marcarFinalizado(dia);
  });
  diasQuitados = [];

  if (!nuevos.length && !marcadosFinalizados) {
    mostrarMensaje(document.getElementById("mensajePanel"), "Debe marcar al menos un día como Sí.", "error");
    return;
  }
  if (marcadosFinalizados) guardarFinalizados(fin);
  if (nuevos.length) {
    registros = registros.concat(nuevos);
    guardarRegistros();
  }

  construirDiasSemana();
  mostrarMensaje(document.getElementById("mensajePanel"), "Asistencia registrada correctamente.", "ok");
}

function semanasDisponibles() {
  var mapa = {};
  registros.forEach(function (r) { if (r.semana && !mapa[r.semana]) mapa[r.semana] = r.semanaFin || ""; });
  return Object.keys(mapa).sort().map(function (s) { return { semana: s, semanaFin: mapa[s] }; });
}

function cargarSemanasAdmin() {
  var sel = document.getElementById("selSemanaAdmin");
  sel.innerHTML = "";
  semanasDisponibles().forEach(function (s) {
    var o = document.createElement("option");
    o.value = s.semana;
    o.textContent = "Semana del " + s.semana + " al " + s.semanaFin;
    sel.appendChild(o);
  });
}

function semanaAdmin() {
  return document.getElementById("selSemanaAdmin").value;
}

function registrosDeSemana(sem) {
  if (!sem) return registros;
  return registros.filter(function (r) { return r.semana === sem; });
}

function semanaAdminInfo() {
  var sem = semanaAdmin();
  for (var i = 0; i < registros.length; i++) {
    if (registros[i].semana === sem) return { semana: registros[i].semana, semanaFin: registros[i].semanaFin, numSemana: registros[i].numSemana };
  }
  return null;
}

function renderAdmin() {
  var sem = semanaAdmin();
  var filtrados = registrosDeSemana(sem);
  var tbody = document.getElementById("cuerpoAdmin");
  tbody.innerHTML = "";
  filtrados.forEach(function (r) {
    var tr = document.createElement("tr");
    [r.semana, r.fecha, r.dia, r.tipo, r.horas || "", r.descripcion || "", "$" + r.monto, r.categoria || "O&L Avance", r.cedula, r.nombre].forEach(function (v) {
      var td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function entrarAdmin() {
  var pass = document.getElementById("adminPass").value;
  var msg = document.getElementById("mensajeAdminLogin");
  if (pass !== ADMIN_PASSWORD) {
    mostrarMensaje(msg, "Contraseña incorrecta.", "error");
    return;
  }
  document.getElementById("vistaLogin").classList.add("hidden");
  document.getElementById("vistaAdmin").classList.remove("hidden");
  document.getElementById("adminBox").classList.add("hidden");
  document.getElementById("adminPass").value = "";
  cargarSemanasAdmin();
  renderAdmin();
  document.getElementById("selSemanaAdmin").addEventListener("change", renderAdmin);
}
function salirAdmin() {
  document.getElementById("vistaAdmin").classList.add("hidden");
  document.getElementById("vistaLogin").classList.remove("hidden");
  document.getElementById("cedula").focus();
}

function agruparPorEmpleado(fuente) {
  fuente = fuente || registros;
  var orden = [];
  var mapa = {};
  fuente.forEach(function (r) {
    if (!mapa[r.cedula]) {
      mapa[r.cedula] = { cedula: r.cedula, nombre: r.nombre, items: [] };
      orden.push(mapa[r.cedula]);
    }
    mapa[r.cedula].items.push(r);
  });
  orden.forEach(function (g) {
    g.total = g.items.reduce(function (s, r) { return s + r.monto; }, 0);
  });
  return orden;
}
function descripcionFinal(item) {
  var base = item.tipo;
  if (item.horas) base = item.tipo + " (" + item.horas + ")";
  if (item.descripcion) return base + ": " + item.descripcion;
  return base;
}

function descargarNomina1() {
  var sem = semanaAdmin();
  var fuente = registrosDeSemana(sem);
  if (!fuente.length) { alert("No hay registros para esta semana."); return; }
  var info = semanaAdminInfo();
  var grupos = agruparPorEmpleado(fuente);
  var totalGeneral = fuente.reduce(function (s, r) { return s + r.monto; }, 0);

  var aoa = [];
  aoa.push(["GERENCIA DE MANTENIMIENTO PREVENTIVO Y SEGURIDAD INDUSTRIAL"]);
  aoa.push(["LA FLORIDA TRIPLE A Y ORDEN Y LIMPIEZA"]);
  aoa.push(["SEMANA Nº" + info.numSemana + " (O&L Pago diario  Avances  O&L/ MTTO PREV Pago Diario 14$)", "", "", "", "", "SEMANA DE " + info.semana + " AL " + info.semanaFin]);
  aoa.push(["Nº", "FECHA", "DESCRIPCIÓN", "COLABORADOR", "", "MONTO TOTAL"]);

  var filasTotales = [];
  grupos.forEach(function (g) {
    g.items.forEach(function (item, i) {
      aoa.push([i + 1, item.fechaTexto, descripcionFinal(item), item.nombre, item.cedula, item.monto]);
    });
    var idx = aoa.length;
    aoa.push(["", "", "", "", "", g.total]);
    filasTotales.push(idx);
    aoa.push([""]);
  });
  var filaTotalGeneral = aoa.length;
  aoa.push(["NOTA:", "", "", "MONTO TOTAL", "", totalGeneral]);

  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{ wch: 5 }, { wch: 30 }, { wch: 50 }, { wch: 24 }, { wch: 14 }, { wch: 12 }];
  ws["!merges"] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 5 } },
    { s: { r: 2, c: 0 }, e: { r: 2, c: 3 } },
    { s: { r: 2, c: 4 }, e: { r: 2, c: 5 } }
  ];

  ws["A1"].s = { font: { bold: true, sz: 16 }, alignment: { horizontal: "center", vertical: "center" } };
  ws["A2"].s = { font: { bold: true, sz: 13 }, alignment: { horizontal: "center", vertical: "center" } };
  ws["A3"].s = { font: { bold: true, sz: 11 } };
  ws["F3"].s = { font: { bold: true, sz: 11 }, alignment: { horizontal: "right" } };
  ["A4", "B4", "C4", "D4", "E4", "F4"].forEach(function (c) {
    ws[c].s = { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" }, fill: { fgColor: { rgb: "D9E1F2" } } };
  });

  for (var r = 4; r <= aoa.length - 1; r++) {
    var celda = ws["F" + (r + 1)];
    if (!celda) continue;
    celda.s = { numFmt: "0.00", alignment: { horizontal: "right" } };
  }
  filasTotales.forEach(function (idx) {
    var celda = ws["F" + (idx + 1)];
    if (celda) celda.s = { font: { bold: true }, numFmt: "0.00", alignment: { horizontal: "right" } };
  });
  var cta = ws["F" + (filaTotalGeneral + 1)];
  if (cta) cta.s = { font: { bold: true }, numFmt: "0.00", alignment: { horizontal: "right" } };

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Nomina 1");
  XLSX.writeFile(wb, "Nomina1_" + info.semana.replace(/\//g, "-") + ".xlsx");
}

function descripcionNomina2(item) {
  var cat = categoriaDeItem(item);
  var t = item.tipo;
  if (cat === "O&L Avance") {
    if (t === "Dia Trabajado") return "Avances OL Día - Aumento 1ro Feb";
    if (t === "Trabajo Nocturno Avances") return "Avances OL Noche - Aumento 1ro Feb";
    if (t === "Domingo Trabajado") return "Domingos y Feriado (Avances) II (S.G)";
  }
  if (cat === "O&L Fijo" && t === "Domingo Trabajado") return "Domingo y Feriado (PF) (S.G)";
  if (t === "Dia Trabajado") return "Día de Trabajo (SG) Ajustes";
  if (t === "Feriado") return "Día de Trabajo (Feriado) (S.G)";
  var comunes = {
    "Trabajo Nocturno": "Trabajo Nocturno (S.G)",
    "Guardia Nocturna": "Guardia Nocturna (S.G)",
    "Trabajo de Madrugada": "Guardia Nocturna (Full) S.G",
    "Trabajo Especial": "Trabajo Extraordinario (S.G)",
    "Horas Extras": "Horas Extras (S.G)",
    "Domingo Trabajado": "Domingo Trabajado (S.G)"
  };
  return comunes[t] || t;
}

function categoriaDeItem(item) {
  if (item.categoria) return item.categoria;
  var emp = EMPLEADOS.find(function (e) { return e.cedula === item.cedula; });
  return emp ? emp.categoria : "Tecnicos Fijo";
}

function areaNomina2(item) {
  var cat = categoriaDeItem(item);
  if (cat.indexOf("O&L") === 0) return "Orden y Limpieza (S.G)";
  return "Servicios Generales";
}

function cedulaPuntos(c) {
  return String(c).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function montoTexto(m) {
  return "$" + m.toFixed(2).replace(".", ",");
}

function fechaAmericana(f) {
  var p = String(f).split("/");
  return Number(p[1]) + "/" + Number(p[0]) + "/" + p[2];
}

function descargarNomina2() {
  var sem = semanaAdmin();
  var conDatos = registrosDeSemana(sem).filter(function (r) { return r.tipo !== "libre"; });
  if (!conDatos.length) { alert("No hay registros para esta semana."); return; }
  var info = semanaAdminInfo();
  var grupos = agruparPorEmpleado(conDatos);
  var diaNum = { "Lunes": 1, "Martes": 2, "Miércoles": 3, "Jueves": 4, "Viernes": 5, "Sábado": 6, "Domingo": 7 };
  var meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  var aoa = [];
  aoa.push(["№ Día", "№ Semana", "Fecha (Doble Click)", "Descripción", "Observaciones", "Área", "Colaborador", "Cédula", "Cantidad Horas (Si Aplica)", "Monto", "MES", "AÑO", "MES AÑO"]);

  grupos.forEach(function (g) {
    g.items.forEach(function (item) {
      var p = String(item.fecha).split("/");
      aoa.push([
        diaNum[item.dia] || "",
        item.numSemana || "",
        fechaAmericana(item.fecha),
        descripcionNomina2(item),
        item.descripcion || "",
        areaNomina2(item),
        item.nombre,
        cedulaPuntos(item.cedula),
        item.horas || "",
        montoTexto(item.monto),
        Number(p[1]),
        Number(p[2]),
        meses[Number(p[1]) - 1] + " del " + p[2]
      ]);
    });
  });

  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{ wch: 7 }, { wch: 9 }, { wch: 14 }, { wch: 34 }, { wch: 60 }, { wch: 22 }, { wch: 24 }, { wch: 15 }, { wch: 14 }, { wch: 12 }, { wch: 6 }, { wch: 7 }, { wch: 16 }];
  for (var c = 0; c < 13; c++) {
    var celda = ws[XLSX.utils.encode_cell({ r: 0, c: c })];
    if (celda) celda.s = { font: { bold: true }, alignment: { horizontal: "center", vertical: "center" }, fill: { fgColor: { rgb: "D9E1F2" } } };
  }

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Nomina 2");
  XLSX.writeFile(wb, "Nomina2_" + info.semana.replace(/\//g, "-") + ".xlsx");
}

function limpiar() {
  if (!registros.length && !cargarFinalizados().length) return;
  if (confirm("¿Seguro que desea borrar todos los registros guardados?")) {
    registros = [];
    guardarRegistros();
    guardarFinalizados([]);
    cargarSemanasAdmin();
    renderAdmin();
  }
}

document.getElementById("btnEntrar").addEventListener("click", entrar);
document.getElementById("cedula").addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
document.getElementById("btnSalir").addEventListener("click", salir);
document.getElementById("btnRegistrar").addEventListener("click", registrar);
document.getElementById("btnAdmin").addEventListener("click", function () {
  document.getElementById("adminBox").classList.toggle("hidden");
});
document.getElementById("btnAdminEntrar").addEventListener("click", entrarAdmin);
document.getElementById("adminPass").addEventListener("keydown", function (e) { if (e.key === "Enter") entrarAdmin(); });
document.getElementById("btnSalirAdmin").addEventListener("click", salirAdmin);

document.getElementById("btnNomina2").addEventListener("click", descargarNomina2);

cargarRegistros();
document.getElementById("cedula").focus();
</script>
